<!DOCTYPE html>
<html lang="fa" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NOVO-BAY | Global Command Center</title>
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="C03-styles-core.css">
    <link rel="stylesheet" href="C04-styles-gis.css">
    <link rel="stylesheet" href="C05-styles-ui.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-ice-minimal">

    <!-- COMMAND VIEWPORT MAIN -->
    <div class="command-viewport" id="mainDashboard">

        <!-- ZONE 1: TOP HEADER BAR -->
        <header class="top-header-bar">
            <div class="header-row-primary">
                <div class="header-brand-cluster">
                    <div class="rotating-nb-logo">NB</div>
                    <span class="brand-title">NOVO-BAY</span>
                </div>

                <div class="header-center-tools">
                    <div class="header-clock" id="liveClock">00:00:00 UTC</div>
                </div>

                <div class="header-controls-cluster">
                    <select id="language-switcher" class="lang-select" onchange="changeLanguage(this.value)">
                        <option value="en">En</option>
                        <option value="fa" selected>فارسی</option>
                        <option value="ru">Русский</option>
                        <option value="zh">中文</option>
                        <option value="ar">العربية</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="it">Italiano</option>
                    </select>

                    <button class="header-btn" title="منو" onclick="togglePanel('sideMenu')">
                        <i class="fa-solid fa-bars"></i> Menu
                    </button>
                </div>
            </div>

            <div class="header-row-secondary">
                <div class="news-ticker">
                    <i class="fa-solid fa-bullhorn news-icon"></i>
                    <marquee scrollamount="4" behavior="scroll" direction="right" id="newsMarquee">
                        آخرین اخبار و مناقصات: اطلاعیه ثبت پیشنهادات چالش ۱۰ روزه بین‌المللی NOVO-BAY | فرصت سرمایه‌گذاری میکرو-اکویتی فعال شد...
                    </marquee>
                </div>

                <div class="audio-player-mini">
                    <button class="header-btn audio-btn" id="audioToggleBtn" onclick="toggleAudio()">
                        <i class="fa-solid fa-music" id="playIcon"></i>
                    </button>

                    <div class="media-nav-btns">
                        <button class="nav-btn"><i class="fa-solid fa-backward-step"></i></button>
                        <button class="nav-btn"><i class="fa-solid fa-play"></i></button>
                        <button class="nav-btn"><i class="fa-solid fa-forward-step"></i></button>
                    </div>
                </div>
            </div>
        </header>

        <!-- ADVERTISEMENT BANNER -->
        <div class="ad-banner-bar" id="ad-banner">
            <div class="ad-content">
                <span class="ad-badge">پروژه ویژه</span>
                <span class="ad-text" id="txt-ad-el">پلتفرم جهانی نوآوری؛ فرصت استثنایی توسعه شبکه و سرمایه‌گذاری بین‌المللی</span>
            </div>
            <button class="ad-close-btn" onclick="closeAdBanner()">&times;</button>
        </div>

        <!-- ZONE 2: WIDE GIS MAP SECTION -->
        <div class="globe-stage-wrapper">
            <div class="phase-10-badge-bottom-left">
                <span class="fraction-text" id="dayFractionDisplay"><strong id="currentDayVal">5</strong><span class="slash-red">/</span><span id="cycleEditionVal">1</span></span>
            </div>

            <div class="nb-watermark-overlay">
                <span class="watermark-letter">NB</span>
            </div>

            <div id="gis-globe-root">
                <div id="live-map-canvas"></div>
            </div>

            <div class="map-legend-box">
                <div class="legend-item"><span class="dot participant"></span> Participants</div>
                <div class="legend-item"><span class="dot networker"></span> Networkers</div>
                <div class="legend-item"><span class="dot project"></span> Projects</div>
                <div class="legend-item"><span class="dot china"></span> China</div>
            </div>
        </div>

        <!-- HORIZONTAL COUNTRY PROGRESS BARS WITH INTEGRATED BORDERLESS DICE -->
        <div class="country-bars-horizontal-strip">
            <div class="horizontal-bar-item">
                <div class="micro-country-info">
                    <span class="country-flag">🇨🇭</span>
                    <span class="micro-chart-label">SWT</span>
                    
                    <!-- BORDERLESS DICE PLACED DIRECTLY BEHIND THE FIRST FLAG -->
                    <div class="inline-dice-box" id="diceContainer" onclick="rollClassicDice()">
                        <div class="two-dice-svg-box">
                            <svg viewBox="0 0 120 52" class="two-dice-svg" id="diceSvg">
                                <g id="die1Group" transform="translate(4
