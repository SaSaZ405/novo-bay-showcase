<!DOCTYPE html>
<html lang="fa" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVO-BAY | Global Command Center</title>
    
    <link rel="stylesheet" href="C03-styles-core.css?v=29.0">
    <link rel="stylesheet" href="C04-styles-gis.css?v=29.0">
    <link rel="stylesheet" href="C05-styles-ui.css?v=29.0">
</head>
<body>

    <div class="command-viewport" id="mainDashboard">
        
        <header class="top-header-bar">
            <div class="header-left">
                <select id="language-switcher" class="lang-select" onchange="changeLanguage(this.value)">
                    <option value="fa">فارسی (FA)</option>
                    <option value="en">English (EN)</option>
                    <option value="ru">Русский (RU)</option>
                    <option value="zh">中文 (ZH)</option>
                    <option value="ar">العربية (AR)</option>
                    <option value="fr">Français (FR)</option>
                    <option value="de">Deutsch (DE)</option>
                    <option value="it">Italiano (IT)</option>
                </select>
            </div>

            <div class="header-center">
                <button class="btn-clean" onclick="toggleAudioGuide()" title="صدا">🔊</button>
                <span id="txt-welcome-banner" style="font-size: 11px; color: #0284c7; font-weight: bold;">خوش‌آمدید به نوو-بی</span>
            </div>

            <div class="header-right">
                <div class="rotating-nb-logo">NB</div>
                <button class="btn-clean" title="منو">☰</button>
            </div>
        </header>

        <!-- نوار تبلیغاتی مدرن در منتهی‌الیه بالا (زیر هدر) -->
        <div id="ad-banner-bar" class="ad-banner-bar">
            <div class="ad-content">
                <span class="ad-badge">ویژه 🇨🇭</span>
                <span id="ad-text-el" class="ad-text">پلتفرم جهانی نوو-بی؛ فرصت استثنایی توسعه شبکه و سرمایه‌گذاری بین‌المللی</span>
            </div>
            <button class="ad-close-btn" onclick="closeAdBanner()">×</button>
        </div>

        <div class="globe-stage-wrapper">
            <div id="gis-globe-root"></div>
        </div>

        <!-- داک کنترل یکپارچه پایین صفحه (Command Bottom Dock) -->
        <div class="command-bottom-dock">
            
            <!-- ردیف بالای داک: باکس چپ، نمودارهای مرکزی، و باکس راست (تاس + سرمایه) -->
            <div class="dock-top-row">
                <!-- باکس چپ -->
                <div class="step-box dock-side-box">
                    <div class="box-title">
                        <span>گام ۶: شبکه</span>
                        <span>[گسترش]</span>
                    </div>
                    <button onclick="openGlobalNetwork()" class="btn-gold" style="margin-top: 4px; padding: 3px;">فعال‌سازی</button>
                </div>

                <!-- نمودارهای میله‌ای مرکزی با پرچم و نام کشور در منتهی‌الیه چپ -->
                <div class="bottom-mini-charts-container">
                    <div class="micro-chart-row">
                        <div class="micro-country-info">
                            <span class="country-flag">🇨🇭</span>
                            <span class="micro-chart-label">سوییس</span>
                        </div>
                        <div class="micro-bar-track"><div class="micro-bar-fill" style="width: 75%;"></div></div>
                    </div>
                    <div class="micro-chart-row">
                        <div class="micro-country-info">
                            <span class="country-flag">🇩🇰</span>
                            <span class="micro-chart-label">دانمارک</span>
                        </div>
                        <div class="micro-bar-track"><div class="micro-bar-fill" style="width: 60%;"></div></div>
                    </div>
                    <div class="micro-chart-row">
                        <div class="micro-country-info">
                            <span class="country-flag">🇸🇬</span>
                            <span class="micro-chart-label">سنگاپور</span>
                        </div>
                        <div class="micro-bar-track"><div class="micro-bar-fill" style="width: 85%;"></div></div>
                    </div>
                </div>

                <!-- خوشه سمت راست (باکس سرمایه + تاس شانس کنار هم) -->
                <div class="dock-right-cluster">
                    <div class="step-box small-mini-box">
                        <div class="box-title" style="margin-bottom: 2px;">
                            <span>گام ۵: سرمایه</span>
                        </div>
                        <button onclick="finalizeTemple()" class="btn-gold" style="padding: 2px 4px; font-size: 7px;">دریافت</button>
                    </div>
                    
                    <!-- تاس شانس -->
                    <div class="step-box dice-card-box" id="floating-polyhedral-dice" onclick="rollPolyhedralDice()" title="پرتاب تاس شانس">
                        <div class="dice-icon-wrapper">
                            <svg viewBox="0 0 100 100" class="d20-svg">
                                <polygon points="50,5 90,25 90,75 50,95 10,75 10,25" fill="#064e3b" stroke="#f59e0b" stroke-width="3"/>
                                <polygon points="50,5 50,50 10,25" fill="#047857" stroke="#fbbf24" stroke-width="2"/>
                                <polygon points="50,5 90,25 50,50" fill="#10b981" stroke="#fbbf24" stroke-width="2"/>
                                <polygon points="10,25 50,50 10,75" fill="#065f46" stroke="#fbbf24" stroke-width="2"/>
                                <polygon points="90,25 90,75 50,50" fill="#059669" stroke="#fbbf24" stroke-width="2"/>
                                <polygon points="10,75 50,50 50,95" fill="#047857" stroke="#fbbf24" stroke-width="2"/>
                                <polygon points="90,75 50,95 50,50" fill="#10b981" stroke="#fbbf24" stroke-width="2"/>
                                <text x="50" y="58" font-size="22" font-weight="bold" fill="#fef3c7" text-anchor="middle" id="dice-val-text">12</text>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ردیف پایین داک: ۴ باکس اصلی گام‌ها -->
            <div class="steps-container">
                <div class="step-box">
                    <div class="box-title">
                        <span>گام ۱: کلمات ($2)</span>
                        <span>[۷ روز]</span>
                    </div>
                    <input type="text" id="user-word-input" class="input-custom" placeholder="کلمه...">
                    <button onclick="checkWordSubmission()" class="btn-gold">ثبت</button>
                </div>

                <div class="step-box">
                    <div class="box-title">
                        <span>گام ۲: عناوین ($4)</span>
                        <span>[۸ روز]</span>
                    </div>
                    <input type="text" id="user-title-input" class="input-custom" placeholder="عنوان...">
                    <button onclick="checkTitleSubmission()" class="btn-gold">پرداخت ۴$</button>
                </div>

                <div class="step-box">
                    <div class="box-title">
                        <span>گام ۳: بیزینس پلن</span>
                        <span>[روز ۸-۹]</span>
                    </div>
                    <input type="text" id="user-proposal-input" class="input-custom" placeholder="لینک پلن...">
                    <button onclick="checkProposalSubmission()" class="btn-gold">ارسال</button>
                </div>

                <div class="step-box">
                    <div class="box-title">
                        <span>گام ۴: وبینار زنده</span>
                        <span>[روز ۱۰]</span>
                    </div>
                    <button onclick="joinStageWebinar()" class="btn-gold" style="margin-top: 10px;">ورود</button>
                </div>
            </div>
        </div>
    </div>

    <script src="C02-config.js"></script>
    <script src="C06-landing-gateway.js"></script>
    <script src="C10-gis-main-map.js?v=29.0"></script>
    <script src="C12-challenge-group1-words.js"></script>
    <script src="C13-challenge-group2-titles.js"></script>
    <script src="C14-challenge-group3-proposals.js"></script>
    <script src="C15-micro-equity-engine.js"></script>

    <script>
        function closeAdBanner() {
            const banner = document.getElementById('ad-banner-bar');
            if (banner) {
                banner.style.display = 'none';
            }
        }

        function rollPolyhedralDice() {
            const diceEl = document.getElementById('floating-polyhedral-dice');
            const textEl = document.getElementById('dice-val-text');
            
            diceEl.classList.add('rolling-anim');
            
            let count = 0;
            const interval = setInterval(() => {
                const rand = Math.floor(Math.random() * 12) + 1;
                textEl.textContent = rand;
                count++;
                if (count > 12) {
                    clearInterval(interval);
                    diceEl.classList.remove('rolling-anim');
                    const finalRes = Math.floor(Math.random() * 12) + 1;
                    textEl.textContent = finalRes;
                }
            }, 60);
        }
    </script>
</body>
</html>
