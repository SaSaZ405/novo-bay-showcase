<!-- هدر بالای صفحه با ابزارها، دکمه صدا، زبان و ارتباط با ما -->
<div class="flex items-center justify-between w-full max-w-7xl mx-auto">
    <div class="flex items-center space-x-2 space-x-reverse">
        <button onclick="toggleAudio()" id="audioBtn" class="interactive-element bg-white/90 hover:bg-white p-2.5 rounded-xl shadow border border-white/50 text-xs font-bold flex items-center gap-1">
            <i class="fa-solid fa-music text-amber-600"></i> <span id="audioStatus">موسیقی: خاموش</span>
        </button>
        <select id="langSelector" onchange="changeLanguage(this.value)" class="interactive-element bg-white/90 hover:bg-white p-2 rounded-xl shadow border border-white/50 text-xs font-bold outline-none">
            <option value="fa">فارسی (FA)</option>
            <option value="en">English (EN)</option>
            <option value="zh">中文 (ZH)</option>
        </select>
    </div>

    <div class="bg-white/90 backdrop-blur-md px-6 py-2 rounded-2xl shadow-sm border border-white/50 text-center">
        <h2 class="text-xl font-black text-gray-900 tracking-wider">NOVO-BAY</h2>
    </div>

    <div class="flex items-center space-x-2 space-x-reverse">
        <button onclick="openHelp()" class="interactive-element bg-blue-50 hover:bg-blue-100 text-blue-800 p-2.5 rounded-xl shadow border border-blue-200 text-xs font-bold flex items-center gap-1">
            <i class="fa-solid fa-circle-question"></i> راهنما
        </button>
        <button onclick="openContact()" class="interactive-element bg-gray-900 hover:bg-black text-white p-2.5 rounded-xl shadow text-xs font-bold">
            ارتباط با ما
        </button>
    </div>
</div>

<!-- کادر راهنمای رنگ‌ها (لژند نقشه) که به صورت شناور اضافه می‌شود -->
<div class="fixed bottom-6 left-6 z-40 bg-white/90 backdrop-blur-md p-3 rounded-xl shadow-lg border border-white/60 text-[10px] space-y-1.5 hidden md:block">
    <div class="font-bold text-gray-800 border-b pb-1">راهنمای نقشه (Legend):</div>
    <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span> در حال چالش (Active)</div>
    <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-blue-500 inline-block"></span> مشترک فعال (Subscriber)</div>
    <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span> سهام‌دار خرد (Shareholder)</div>
</div>
