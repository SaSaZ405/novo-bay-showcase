<!-- ZONE 5: CHAT ROOM & CONNECTED DISPLAY PANEL -->
<div class="zone5-container">
    <div class="chat-room-box">
        <div class="chat-title">Challenge Chat Room</div>
        <div class="chat-messages" id="chatMessages">
            <p>[1:32:38] @User1: Nice map</p>
            <p>[1:42:38] @User1: Working on Words Challenge</p>
            <p>[1:42:38] @User2: Dice rolled!</p>
        </div>
        <div class="chat-input-row">
            <input type="text" id="chatInput" placeholder="پیام خود را بنویسید...">
            <button onclick="sendChatMessage()">Send</button>
        </div>
    </div>

    <!-- نمایشگر متصل متحرک/شیشه‌ای -->
    <div class="right-companion-panel" id="companionDisplayPanel">
        <div class="companion-header">
            <span class="companion-title" id="companionTitle">
                <i class="fa-solid fa-desktop"></i> نمایشگر مرکزی سیستم
            </span>
            <div class="companion-controls">
                <button class="glass-expand-btn" title="بزرگ‌نمایی شیشه‌ای" onclick="expandGlassDisplay()">
                    <i class="fa-solid fa-expand"></i>
                </button>
                <button class="glass-close-btn" title="بستن" onclick="shrinkGlassDisplay()" style="display:none;">
                    <i class="fa-solid fa-compress"></i>
                </button>
            </div>
        </div>
        <div class="companion-body" id="companionBodyContent">
            <div class="display-placeholder">
                <i class="fa-solid fa-circle-nodes pulse-icon"></i>
                <p>یکی از چالش‌های بالا را فعال کنید تا رویدادها و محتوای آن در این نمایشگر زنده پردازش شود.</p>
            </div>
        </div>
    </div>
</div>
